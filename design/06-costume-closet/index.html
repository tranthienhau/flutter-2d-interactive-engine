<script>
        document.addEventListener('DOMContentLoaded', () => {
            const chips = document.querySelectorAll('section:nth-of-type(2) button');
            chips.forEach(chip => {
                chip.addEventListener('click', () => {
                    // Reset all chips
                    chips.forEach(c => {
                        c.className = "h-[48px] px-6 rounded-full bg-surface text-text-tertiary font-title text-title shadow-sm active:scale-95 transition-transform border border-border flex items-center justify-center";
                    });
                    // Set active chip
                    chip.className = "h-[48px] px-6 rounded-full bg-secondary-container text-on-secondary-container font-title text-title shadow-soft active:scale-95 transition-transform flex items-center justify-center";
                });
            });
        });
