<style>
        .map-trail {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            background-image: linear-gradient(to bottom, #c9c4d9 50%, transparent 50%);
            background-size: 4px 16px;
            background-repeat: repeat-y;
            z-index: 0;
        }
        
        .pulse-animation {
            animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(107, 78, 255, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 15px rgba(107, 78, 255, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(107, 78, 255, 0); }
        }
        
        body { padding-top: env(safe-area-inset-top, 59px); padding-bottom: env(safe-area-inset-bottom, 34px); }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-background min-h-screen text-on-surface font-body pb-[100px] pt-[80px]">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface h-touch-target-min flex justify-between items-center px-edge-padding pt-stack-md transition-transform active:scale-95 duration-200">
<div class="flex items-center gap-stack-sm hover:opacity-80 cursor-pointer h-touch-target-min min-w-[56px]">
<img class="w-12 h-12 rounded-full object-cover shadow-soft-elevation border-2 border-surface-alt" data-alt="A cute, highly detailed, 3D rendered fox mascot character named Bramble, designed for a preschool app. The fox has big friendly eyes, vibrant orange and white fur, and a playful expression, set against a bright, modern light-mode background with soft lighting." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBHEsrWbifdX4zUY2w4eLA3PxwnKj9Whezz9gPMwNCVvAfJ_MpjCITZVv7FCNP-9FLy8xR445Dhp0VDelkhQTSdVfgYTQoigwuuq36n9ORq4UZbEYdqLOI1O9O9exAxE71Ezer9JH0g9hDrIBCTHkcK75MElE2UeixI6g8QZIBm7wa88FHof2n9qj40A8RyaaxWPUKZgTpn1hKFYAmo1PGWwAo0qLJkNKvWjV2K5MkVMiwfQK5j2lWXO10TtNrHny2HRhKRUZ8mDU07"/>
</div>
<div class="flex-1 text-center hidden md:block">
<h1 class="font-display-mobile text-display-mobile text-primary font-extrabold tracking-tight">Bloom Play</h1>
</div>
<div class="flex items-center gap-2 bg-surface-alt px-4 py-2 rounded-full h-[48px] hover:opacity-80 cursor-pointer shadow-soft-elevation">
<span class="font-title text-title text-primary-fixed-variant">Bramble</span>
<span class="text-tertiary-container">•</span>
<span class="font-title text-title text-secondary-container">12</span>
<span class="material-symbols-outlined text-secondary-container" style="font-variation-settings: 'FILL' 1;">star</span>
</div>
</header>
<main class="max-w-md mx-auto px-edge-padding space-y-stack-xl relative z-10 pt-stack-lg">
<!-- Hero Card -->
<section aria-label="Current Lesson" class="rounded-[20px] shadow-soft-elevation p-6 text-on-primary bg-gradient-to-r from-primary-container to-secondary-container relative overflow-hidden h-[200px] flex flex-col justify-between" role="region">
<div class="absolute inset-0 opacity-20 pointer-events-none" style="background-image: radial-gradient(circle at 80% 20%, white 0%, transparent 40%);"></div>
<div>
<span class="bg-surface/20 text-on-primary px-3 py-1 rounded-full font-label text-label inline-block mb-2">Up Next</span>
<h2 class="font-display-mobile text-display-mobile leading-tight drop-shadow-md">Lesson 5:<br/>Count the Stars</h2>
</div>
<button aria-label="Play Lesson 5" class="bg-surface text-primary font-title text-title h-touch-target-min rounded-full px-6 flex items-center justify-center gap-2 shadow-soft-elevation active:scale-95 transition-transform w-fit">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
                Play
            </button>
<img class="absolute -right-4 -bottom-4 w-32 h-32 object-contain opacity-90 drop-shadow-lg" data-alt="A whimsical, 3D rendered illustration of sparkling golden stars and a cute telescope floating in space, designed for a preschool app. The illustration has soft edges, vibrant colors, and a joyful mood, perfectly matching a bright, modern tactile aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDwtajHv09zBBgu20ptjb9qzZaPfsxD6eYx--hmVOaESVBKEdmwXNxMQYTdQZ3O9CWrkmScknjsj2XRG65z5MdrQYyUn5_nyxV0YNajmQf6ASXmZD_4UMMm3UR8p0AXFF7lUqInYHk3KhDinfwo1-bTLjXysibFdincOf2MyJIhKNREUpkQakjs8-xZXjK7S2Qvo4Lpmhh3OpnKucIXc_DCCoztmZpfQ38LB8QE11MyPeuBcvRPH19C9iHGf2IqyiJ8S-xW3nPii1LZ"/>
</section>
<!-- Lesson Map -->
<section aria-label="Lesson Path" class="relative py-stack-lg min-h-[500px]" role="region">
<div class="map-trail"></div>
<div class="relative z-10 space-y-12 flex flex-col items-center">
<!-- Node 1: Completed -->
<button aria-label="Completed: Shapes" class="w-[72px] h-[72px] rounded-full bg-secondary-container text-surface flex items-center justify-center shadow-soft-elevation active:scale-95 transition-transform transform -translate-x-8">
<span class="material-symbols-outlined text-4xl" style="font-variation-settings: 'FILL' 1;">check</span>
</button>
<!-- Node 2: Completed -->
<button aria-label="Completed: Colors" class="w-[72px] h-[72px] rounded-full bg-secondary-container text-surface flex items-center justify-center shadow-soft-elevation active:scale-95 transition-transform transform translate-x-12">
<span class="material-symbols-outlined text-4xl" style="font-variation-settings: 'FILL' 1;">check</span>
</button>
<!-- Node 3: Completed -->
<button aria-label="Completed: Animals" class="w-[72px] h-[72px] rounded-full bg-secondary-container text-surface flex items-center justify-center shadow-soft-elevation active:scale-95 transition-transform transform -translate-x-4">
<span class="material-symbols-outlined text-4xl" style="font-variation-settings: 'FILL' 1;">check</span>
</button>
<!-- Node 4: Completed -->
<button aria-label="Completed: Letters" class="w-[72px] h-[72px] rounded-full bg-secondary-container text-surface flex items-center justify-center shadow-soft-elevation active:scale-95 transition-transform transform translate-x-8">
<span class="material-symbols-outlined text-4xl" style="font-variation-settings: 'FILL' 1;">check</span>
</button>
<!-- Node 5: Current -->
<div class="relative transform -translate-x-2">
<div class="absolute inset-0 rounded-full pulse-animation bg-primary-container opacity-50"></div>
<button aria-label="Current Lesson: Counting" class="w-[96px] h-[96px] rounded-full bg-primary-container text-surface flex items-center justify-center shadow-soft-elevation relative z-10 active:scale-95 transition-transform border-4 border-surface">
<span class="material-symbols-outlined text-5xl" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
</button>
</div>
<!-- Node 6: Locked -->
<button aria-label="Locked Lesson" class="w-[64px] h-[64px] rounded-full bg-surface-variant text-text-tertiary flex items-center justify-center shadow-sm opacity-80 cursor-not-allowed transform translate-x-6" disabled="">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">lock</span>
</button>
<!-- Node 7: Locked -->
<button aria-label="Locked Lesson" class="w-[64px] h-[64px] rounded-full bg-surface-variant text-text-tertiary flex items-center justify-center shadow-sm opacity-80 cursor-not-allowed transform -translate-x-10" disabled="">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">lock</span>
</button>
<!-- Node 8: Locked -->
<button aria-label="Locked Lesson" class="w-[64px] h-[64px] rounded-full bg-surface-variant text-text-tertiary flex items-center justify-center shadow-sm opacity-80 cursor-not-allowed transform translate-x-2" disabled="">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">lock</span>
</button>
</div>
