<style>
        body { font-family: 'Baloo 2', sans-serif; }
        .dashed-trail {
            stroke-dasharray: 8 8;
            animation: dash 1s linear infinite reverse;
        }
        @keyframes dash {
            to { stroke-dashoffset: 16; }
        }
        .float-animation {
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .pulse-soft {
            animation: pulse-soft 3s ease-in-out infinite;
        }
        @keyframes pulse-soft {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }
        .shimmer-slot {
            animation: shimmer-pulse 2s ease-in-out infinite;
        }
        @keyframes shimmer-pulse {
            0% { opacity: 0.7; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
            100% { opacity: 0.7; transform: scale(1); }
        }
        .banner-float {
            animation: banner-float 4s ease-in-out infinite;
        }
        @keyframes banner-float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-4px); }
            100% { transform: translateY(0px); }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);

<body class="bg-background text-on-background m-0 p-0 overflow-hidden h-[884px] w-full flex justify-center bg-gray-900">

<div class="w-4 h-4 rounded-full bg-primary shadow-inner"></div>
<div class="w-4 h-4 rounded-full bg-outline-variant shadow-inner"></div>
<div class="w-4 h-4 rounded-full bg-outline-variant shadow-inner"></div>
<div class="w-4 h-4 rounded-full bg-outline-variant shadow-inner"></div>
</div>
</div>
<!-- Instruction Ribbon Area -->

</div>
</div>
